<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>SentinelClick GPS Beacon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #050505; color: white;
      min-height: 100vh; display: flex;
      flex-direction: column; align-items: center;
      padding: 24px 16px;
    }
    h1 { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
    h1 span { color: #f97316; }
    .subtitle { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 24px; }

    .status-card {
      width: 100%; max-width: 360px;
      background: #111; border: 2px solid #222;
      border-radius: 20px; padding: 20px;
      margin-bottom: 16px; text-align: center;
    }
    .status-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #444; display: inline-block;
      margin-right: 8px; vertical-align: middle;
    }
    .status-dot.green  { background: #22c55e; animation: p 1.5s infinite; }
    .status-dot.red    { background: #ef4444; }
    .status-dot.yellow { background: #facc15; animation: p 1s infinite; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-label { font-size: 13px; font-weight: 700; vertical-align: middle; }
    .coords { font-family: monospace; font-size: 13px; color: #f97316; margin-top: 10px; line-height: 1.9; }
    .accuracy { font-size: 11px; color: #555; margin-top: 4px; }

    .btn {
      width: 100%; max-width: 360px;
      padding: 18px; border-radius: 16px; border: none;
      font-size: 15px; font-weight: 900;
      text-transform: uppercase; letter-spacing: 1px;
      cursor: pointer; transition: all 0.2s; margin-bottom: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-start { background: linear-gradient(135deg, #f97316, #facc15); color: black; }
    .btn-stop  { background: #1a1a1a; color: #ef4444; border: 2px solid #ef4444; }
    .btn:active   { transform: scale(0.96); opacity: 0.85; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .stats {
      width: 100%; max-width: 360px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-bottom: 14px;
    }
    .stat-box {
      background: #111; border: 1px solid #222;
      border-radius: 10px; padding: 10px; text-align: center;
    }
    .stat-num   { font-size: 22px; font-weight: 900; color: #f97316; }
    .stat-label { font-size: 9px; color: #444; text-transform: uppercase; margin-top: 2px; }

    .log {
      width: 100%; max-width: 360px;
      background: #0a0a0a; border: 1px solid #1a1a1a;
      border-radius: 12px; padding: 10px;
      height: 200px; overflow-y: auto;
      font-family: monospace; font-size: 11px; color: #555;
    }
    .log-entry      { margin-bottom: 4px; line-height: 1.5; word-break: break-all; }
    .log-entry.ok   { color: #22c55e; }
    .log-entry.err  { color: #ef4444; }
    .log-entry.info { color: #f97316; }
    .log-entry.warn { color: #facc15; }
  </style>
</head>
<body>
  <h1>SENTINEL<span>CLICK</span></h1>
  <p class="subtitle">GPS Beacon — Phone Mode</p>

  <div class="status-card">
    <div>
      <span class="status-dot" id="statusDot"></span>
      <span class="status-label" id="statusLabel">Idle — tap Start</span>
    </div>
    <div class="coords" id="coordsDisplay">LAT: —<br>LNG: —</div>
    <div class="accuracy" id="accuracyDisplay">Accuracy: —</div>
  </div>

  <button class="btn btn-start" id="startBtn">▶ Start GPS Beacon</button>
  <button class="btn btn-stop"  id="stopBtn"  disabled>■ Stop Beacon</button>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-num" id="statSent">0</div>
      <div class="stat-label">Broadcasts</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="statHz">—</div>
      <div class="stat-label">Sec / update</div>
    </div>
  </div>

  <div class="log" id="logBox"></div>

  <!-- Load Supabase AFTER body so DOM is ready -->
  <script>
    // ── Your Supabase credentials ─────────────────────────────────────────────
    const SUPABASE_URL      = 'https://dpksnvcfsqfkwgtdpbws.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwa3NudmNmc3Fma3dndGRwYndzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMDIzMzYsImV4cCI6MjA5MjY3ODMzNn0.X1ymhR4OgUO-fvjYqJF0VfbqGd8Ul2F680PWsqrU74o';
    const CHANNEL_NAME      = 'sentinel-gps';
    const SEND_INTERVAL_MS  = 2000;
    // ─────────────────────────────────────────────────────────────────────────

    let sbClient      = null;
    let sbChannel     = null;
    let gpsWatchId    = null;
    let sendLoopId    = null;
    let pendingCoords = null;
    let lastSendTs    = 0;
    let statSent      = 0;
    let running       = false;

    // ── Logging ───────────────────────────────────────────────────────────────
    function log(msg, type = '') {
      const box   = document.getElementById('logBox');
      const el    = document.createElement('div');
      el.className = 'log-entry ' + type;
      el.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      box.insertBefore(el, box.firstChild);
      if (box.children.length > 80) box.removeChild(box.lastChild);
    }

    function setStatus(label, dot) {
      document.getElementById('statusLabel').textContent = label;
      document.getElementById('statusDot').className = 'status-dot ' + dot;
    }

    // ── GPS callbacks ─────────────────────────────────────────────────────────
    function onPosition(pos) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;
      pendingCoords = { lat, lng, accuracy: acc };
      document.getElementById('coordsDisplay').innerHTML =
        'LAT: ' + lat.toFixed(6) + '<br>LNG: ' + lng.toFixed(6);
      document.getElementById('accuracyDisplay').textContent =
        'Accuracy: \u00b1' + Math.round(acc) + 'm';
      if (acc > 50) setStatus('Weak GPS signal...', 'yellow');
      else          setStatus('GPS locked \u26a1 broadcasting', 'green');
    }

    function onGPSError(err) {
      var msgs = { 1: 'Permission denied — allow location', 2: 'GPS unavailable', 3: 'GPS timeout — retrying' };
      var msg  = msgs[err.code] || ('GPS error ' + err.code);
      log('GPS: ' + msg, err.code === 3 ? 'warn' : 'err');
      if (err.code !== 3) setStatus(msg, 'red');
      else setStatus('GPS weak — retrying...', 'yellow');
    }

    // ── Broadcast one GPS reading ─────────────────────────────────────────────
    function broadcastGPS() {
      if (!sbChannel || !pendingCoords || !running) return;
      var lat = pendingCoords.lat;
      var lng = pendingCoords.lng;
      var acc = pendingCoords.accuracy;
      var now = Date.now();

      sbChannel.send({
        type: 'broadcast',
        event: 'gps',
        payload: { lat: lat, lng: lng, accuracy: acc, ts: now }
      }).then(function() {
        var elapsed = lastSendTs ? ((now - lastSendTs) / 1000).toFixed(1) : '--';
        lastSendTs = now;
        statSent++;
        document.getElementById('statSent').textContent = statSent;
        document.getElementById('statHz').textContent   = elapsed + 's';
        log('\u2713 ' + lat.toFixed(5) + ', ' + lng.toFixed(5) + ' (\u00b1' + Math.round(acc) + 'm)', 'ok');
      }).catch(function(err) {
        log('Broadcast error: ' + (err.message || err), 'err');
      });
    }

    // ── Main start ────────────────────────────────────────────────────────────
    document.getElementById('startBtn').addEventListener('click', function() {
      log('Button tapped — starting...', 'info');

      if (!navigator.geolocation) {
        log('ERROR: Geolocation not supported on this browser/device', 'err');
        return;
      }

      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled  = false;
      setStatus('Loading Supabase...', 'yellow');

      // Dynamically load Supabase so we know exactly when it's ready
      var script    = document.createElement('script');
      script.src    = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
      script.onload = function() {
        log('Supabase SDK loaded', 'info');
        initSupabase();
      };
      script.onerror = function() {
        log('ERROR: Failed to load Supabase SDK — check internet connection', 'err');
        setStatus('SDK load failed', 'red');
        document.getElementById('startBtn').disabled = false;
      };
      document.head.appendChild(script);
    });

    function initSupabase() {
      try {
        setStatus('Connecting...', 'yellow');
        log('Creating Supabase client...', 'info');

        sbClient  = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        sbChannel = sbClient.channel(CHANNEL_NAME, {
          config: { broadcast: { self: false, ack: false } }
        });

        sbChannel.subscribe(function(status, err) {
          log('Channel status: ' + status, status === 'SUBSCRIBED' ? 'info' : 'warn');

          if (status === 'SUBSCRIBED') {
            log('Connected! Starting GPS...', 'ok');
            setStatus('Acquiring GPS...', 'yellow');
            startGPS();
          } else if (status === 'CHANNEL_ERROR') {
            log('Channel error: ' + (err ? JSON.stringify(err) : 'unknown'), 'err');
            setStatus('Channel failed', 'red');
            document.getElementById('startBtn').disabled = false;
          } else if (status === 'TIMED_OUT') {
            log('Connection timed out — check internet', 'err');
            setStatus('Timed out', 'red');
            document.getElementById('startBtn').disabled = false;
          }
        });

      } catch (e) {
        log('Init error: ' + e.message, 'err');
        setStatus('Init failed', 'red');
        document.getElementById('startBtn').disabled = false;
      }
    }

    function startGPS() {
      running = true;

      gpsWatchId = navigator.geolocation.watchPosition(onPosition, onGPSError, {
        enableHighAccuracy: true,
        maximumAge: 3000,
        timeout: 20000
      });

      // Send immediately once GPS locks, then every SEND_INTERVAL_MS
      sendLoopId = setInterval(broadcastGPS, SEND_INTERVAL_MS);
      log('GPS watch started — broadcasting every ' + (SEND_INTERVAL_MS/1000) + 's', 'info');
    }

    // ── Stop ──────────────────────────────────────────────────────────────────
    document.getElementById('stopBtn').addEventListener('click', function() {
      running = false;
      clearInterval(sendLoopId);
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }
      if (sbChannel) {
        sbChannel.unsubscribe();
        sbChannel = null;
      }
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled  = true;
      setStatus('Stopped', '');
      log('Beacon stopped', 'info');
    });

    log('Ready — tap Start GPS Beacon', 'info');
  </script>
</body>
</html>
