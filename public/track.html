<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelCare Live Tracking</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #0a0a0a;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(to right, #000, #1a1a1a);
      border-bottom: 2px solid #fbbf24;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(251, 191, 36, 0.1);
    }

    .header h1 {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 1.5s infinite;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
    }

    .status-indicator.active-track {
      background: #fbbf24;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Info Bar */
    .info-bar {
      background: rgba(30, 30, 30, 0.8);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }

    .location-info {
      display: flex;
      gap: 30px;
      font-family: 'Courier New', monospace;
    }

    .location-item {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .location-label {
      color: #fbbf24;
      font-weight: bold;
      min-width: 80px;
    }

    .location-value {
      color: #00ff88;
    }

    .update-time {
      color: #999;
      font-size: 12px;
    }

    /* Map Container */
    .map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Loading State */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(0, 0, 0, 0.8);
      padding: 40px;
      border-radius: 12px;
      border: 2px solid #fbbf24;
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .loading h2 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #fbbf24;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Emergency Alert */
    .emergency-alert {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #dc2626;
      border: 2px solid #ff0000;
      border-radius: 8px;
      padding: 12px 16px;
      color: white;
      font-weight: bold;
      z-index: 1000;
      animation: blink 1s infinite;
      display: none;
    }

    .emergency-alert.show {
      display: block;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0.6; }
    }

    /* Footer */
    .footer {
      background: rgba(0, 0, 0, 0.8);
      border-top: 1px solid #333;
      padding: 12px 20px;
      text-align: center;
      font-size: 12px;
      color: #999;
    }

    .footer a {
      color: #fbbf24;
      text-decoration: none;
      margin: 0 8px;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <span class="status-indicator active-track"></span>
        🚨 SENTINELCARE LIVE TRACKING
      </h1>
    </div>

    <div class="info-bar">
      <div class="location-info">
        <div class="location-item">
          <span class="location-label">LATITUDE:</span>
          <span class="location-value" id="latitude">Loading...</span>
        </div>
        <div class="location-item">
          <span class="location-label">LONGITUDE:</span>
          <span class="location-value" id="longitude">Loading...</span>
        </div>
      </div>
      <div class="update-time">Last updated: <span id="updateTime">--:--:--</span></div>
    </div>

    <div class="map-container">
      <div id="map" style="width: 100%; height: 100%; z-index: 1;"></div>
      <div class="emergency-alert" id="emergencyAlert">
        🚨 EMERGENCY - Device under monitoring
      </div>
    </div>

    <div class="footer">
      <p>SentinelCare Real-Time GPS Tracking | <a href="javascript:location.reload()">Refresh</a> | Auto-updates dynamically</p>
    </div>
  </div>

  <script>
    let map;
    let marker;
    
    // Updated to Butuan City coordinates
    let currentLat = 8.9475;
    let currentLng = 125.5406;
    let isEmergency = false;

    // Initialize the Leaflet Map
    function initMap() {
      map = L.map('map').setView([currentLat, currentLng], 16);
      
      // Add OpenStreetMap tiles
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      // Add the tracking marker
      marker = L.marker([currentLat, currentLng]).addTo(map);
      
      // Apply dark mode filter to the map tiles to match the UI aesthetic
      document.querySelector('.leaflet-layer').style.filter = 'invert(90%) hue-rotate(180deg) brightness(0.6)';
    }

    // Update the UI text elements
    function updateDashboard() {
      document.getElementById('latitude').textContent = currentLat.toFixed(6);
      document.getElementById('longitude').textContent = currentLng.toFixed(6);
      document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();

      const emergencyAlert = document.getElementById('emergencyAlert');
      if (localStorage.getItem('sentinel_sos_active') === 'true') {
        emergencyAlert.classList.add('show');
      } else {
        emergencyAlert.classList.remove('show');
      }
    }

    initMap();

    // Connect to ACTUAL Device GPS
    if ("geolocation" in navigator) {
      // watchPosition continually streams live GPS data
      navigator.geolocation.watchPosition(
        (position) => {
          currentLat = position.coords.latitude;
          currentLng = position.coords.longitude;

          // Smoothly move the marker WITHOUT reloading the map
          marker.setLatLng([currentLat, currentLng]);
          
          updateDashboard();
        },
        (error) => {
          console.error("GPS Error. Falling back to local storage.", error);
          fallbackToMockData();
        },
        { 
          enableHighAccuracy: true, 
          maximumAge: 0, 
          timeout: 5000 
        }
      );
    } else {
      fallbackToMockData();
    }

    // Fallback if the browser denies GPS permissions or GPS is unavailable
    function fallbackToMockData() {
      setInterval(() => {
        const savedGeo = localStorage.getItem('sentinel_geo');
        if (savedGeo) {
          const geo = JSON.parse(savedGeo);
          currentLat = geo.lat;
          currentLng = geo.lng;
          marker.setLatLng([currentLat, currentLng]);
          updateDashboard();
        }
      }, 2000);
    }

    // Listen for SOS state changes
    window.addEventListener('storage', (e) => {
      if (e.key === 'sentinel_sos_active') updateDashboard();
    });
  </script>
</body>
</html>
