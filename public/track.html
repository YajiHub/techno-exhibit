<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelCare Live Tracking</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #0a0a0a;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    /* Header */
    .header {
      background: linear-gradient(to right, #000, #1a1a1a);
      border-bottom: 2px solid #fbbf24;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(251, 191, 36, 0.1);
      z-index: 10;
    }

    .header h1 {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 1.5s infinite;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
    }

    .status-indicator.active-track {
      background: #fbbf24;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Info Bar */
    .info-bar {
      background: rgba(30, 30, 30, 0.8);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      font-size: 14px;
      z-index: 10;
    }

    .location-info {
      display: flex;
      gap: 30px;
      font-family: 'Courier New', monospace;
    }

    .location-item {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .location-label {
      color: #fbbf24;
      font-weight: bold;
      min-width: 80px;
    }

    .location-value {
      color: #00ff88;
    }

    .update-time {
      color: #999;
      font-size: 12px;
    }

    /* Map Container */
    .map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Loading State */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      transition: opacity 0.5s ease;
    }

    .loading-overlay h2 {
      font-size: 20px;
      margin-top: 20px;
      color: #fbbf24;
      letter-spacing: 2px;
    }

    .spinner {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 4px solid #333;
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Emergency Alert */
    .emergency-alert {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #dc2626;
      border: 2px solid #ff0000;
      border-radius: 8px;
      padding: 12px 16px;
      color: white;
      font-weight: bold;
      z-index: 1000;
      animation: blink 1s infinite;
      display: none;
    }

    .emergency-alert.show {
      display: block;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0.6; }
    }

    /* Footer */
    .footer {
      background: rgba(0, 0, 0, 0.8);
      border-top: 1px solid #333;
      padding: 12px 20px;
      text-align: center;
      font-size: 12px;
      color: #999;
      z-index: 10;
    }

    .footer a {
      color: #fbbf24;
      text-decoration: none;
      margin: 0 8px;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <h2>ACQUIRING GPS SIGNAL...</h2>
    </div>

    <div class="header">
      <h1>
        <span class="status-indicator active-track"></span>
        🚨 SENTINELCARE LIVE TRACKING
      </h1>
    </div>

    <div class="info-bar">
      <div class="location-info">
        <div class="location-item">
          <span class="location-label">LATITUDE:</span>
          <span class="location-value" id="latitude">--.------</span>
        </div>
        <div class="location-item">
          <span class="location-label">LONGITUDE:</span>
          <span class="location-value" id="longitude">--.------</span>
        </div>
      </div>
      <div class="update-time">Last updated: <span id="updateTime">--:--:--</span></div>
    </div>

    <div class="map-container">
      <div id="map" style="width: 100%; height: 100%; z-index: 1;"></div>
      <div class="emergency-alert" id="emergencyAlert">
        🚨 EMERGENCY - Device under monitoring
      </div>
    </div>

    <div class="footer">
      <p>SentinelCare Real-Time GPS Tracking | <a href="javascript:location.reload()">Refresh</a> | Auto-updates dynamically</p>
    </div>
  </div>

  <script>
    let map;
    let marker;
    let isMapInitialized = false;

    // Updates the text UI at the top
    function updateDashboard(lat, lng) {
      document.getElementById('latitude').textContent = lat.toFixed(6);
      document.getElementById('longitude').textContent = lng.toFixed(6);
      document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();

      const emergencyAlert = document.getElementById('emergencyAlert');
      if (localStorage.getItem('sentinel_sos_active') === 'true') {
        emergencyAlert.classList.add('show');
      } else {
        emergencyAlert.classList.remove('show');
      }
    }

    // Handles the Map Logic (No more jumping!)
    function handleLocationUpdate(lat, lng) {
      updateDashboard(lat, lng);

      if (!isMapInitialized) {
        // First valid GPS signal received: Remove loading screen
        const loader = document.getElementById('loadingOverlay');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);

        // Initialize Map exactly at the real location
        map = L.map('map').setView([lat, lng], 16);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors',
          maxZoom: 19
        }).addTo(map);

        marker = L.marker([lat, lng]).addTo(map);
        
        // Apply dark mode aesthetic
        document.querySelector('.leaflet-layer').style.filter = 'invert(90%) hue-rotate(180deg) brightness(0.6)';
        
        isMapInitialized = true;
      } else {
        // Map is already loaded: Move marker AND Camera smoothly
        marker.setLatLng([lat, lng]);
        map.panTo([lat, lng]); // <--- THIS is what your original code was missing!
      }
    }

    // 1. Check LocalStorage first (Fastest load)
    const savedGeo = localStorage.getItem('sentinel_geo');
    if (savedGeo) {
      try {
        const geo = JSON.parse(savedGeo);
        if (geo.lat && geo.lng) handleLocationUpdate(geo.lat, geo.lng);
      } catch (e) { console.error("Error parsing stored GPS"); }
    }

    // 2. Connect to Browser GPS
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          handleLocationUpdate(position.coords.latitude, position.coords.longitude);
        },
        (error) => {
          console.error("GPS Error", error);
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );
    }

    // 3. Listen for changes from App.jsx Dashboard
    window.addEventListener('storage', (e) => {
      if (e.key === 'sentinel_geo') {
        const geo = JSON.parse(e.newValue);
        if (geo && geo.lat && geo.lng) handleLocationUpdate(geo.lat, geo.lng);
      }
      if (e.key === 'sentinel_sos_active') {
        updateDashboard(
          parseFloat(document.getElementById('latitude').textContent),
          parseFloat(document.getElementById('longitude').textContent)
        );
      }
    });
  </script>
</body>
</html>
